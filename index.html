<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Pulse</title>
    <style>
        :root {
            --ink: #292332;
            --muted: #817786;
            --line: rgba(255, 255, 255, .78);
            --panel: rgba(255, 255, 255, .38);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 82% 9%, rgba(215, 193, 255, .54), transparent 30%),
                radial-gradient(circle at 15% 78%, rgba(255, 192, 212, .55), transparent 36%),
                #fcf5f7;
        }

        .app {
            width: min(100%, 430px);
            min-height: 100vh;
            padding: max(28px, env(safe-area-inset-top)) 22px max(26px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            background: linear-gradient(155deg, rgba(255,255,255,.48), rgba(255,226,239,.35));
        }

        .topbar { display: flex; align-items: center; justify-content: space-between; }

        .icon-button, .brand, .action-button {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .36);
            box-shadow: 0 7px 22px rgba(128, 84, 124, .07);
        }

        .icon-button {
            width: 56px;
            height: 56px;
            padding: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--ink);
            cursor: pointer;
        }

        .icon-button svg, .action-button svg { width: 25px; height: 25px; stroke: currentColor; }
        .icon-button:hover, .action-button:hover { background: rgba(255, 255, 255, .68); }

        .brand {
            min-height: 56px;
            padding: 6px 17px 6px 7px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: 650;
            letter-spacing: -.5px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 26%, #fff 0 8%, transparent 18%), linear-gradient(145deg, #f95cbd, #8be4ed 55%, #7370d8);
            box-shadow: inset -4px -5px 11px rgba(50, 24, 98, .22), 0 2px 7px rgba(75, 46, 112, .2);
        }

        .hero { text-align: center; padding-top: clamp(58px, 10vh, 96px); }
        h1 {
            margin: 0;
            font-size: clamp(25px, 6.4vw, 30px);
            font-weight: 600;
            letter-spacing: -.75px;
            line-height: 1.2;
        }
        .status { min-height: 22px; margin: 10px 0 0; color: var(--muted); font-size: 13px; }

        .orb-wrap {
            --voice-level: .07;
            --voice-scale: 1.006;
            --wave-scale: 1.03;
            --wave-opacity: .14;
            --orb-saturation: 1.02;
            --orb-brightness: 1.01;
            position: relative;
            width: 220px;
            height: 220px;
            margin: 36px auto 28px;
            display: grid;
            place-items: center;
        }
        .wave {
            position: absolute;
            width: 190px;
            height: 190px;
            border: 1px solid rgba(135, 225, 250, .8);
            border-radius: 50%;
            opacity: 0;
            transform: scale(var(--wave-scale));
            transition: opacity .08s ease-out, transform .08s ease-out;
        }
        .wave-two { border-color: rgba(255, 173, 216, .75); }
        .wave-three { border-color: rgba(188, 167, 255, .58); }
        .orb-wrap.is-listening .wave { animation: ripple 1.7s cubic-bezier(.1, .64, .36, 1) infinite; }
        .orb-wrap.is-listening .wave-two { animation-delay: .53s; }
        .orb-wrap.is-listening .wave-three { animation-delay: 1.06s; }
        @keyframes ripple {
            0% { opacity: var(--wave-opacity); transform: scale(var(--wave-scale)); }
            100% { opacity: 0; transform: scale(1.36); }
        }

        .processing-ring {
            position: absolute;
            inset: 5px;
            border: 2px solid transparent;
            border-top-color: rgba(103, 220, 239, .95);
            border-right-color: rgba(247, 120, 197, .82);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .orb {
            position: relative;
            width: 190px;
            height: 190px;
            overflow: hidden;
            border-radius: 50%;
            box-shadow: 0 17px 27px rgba(125, 64, 123, .2);
        }

        .orb img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .orb-wrap.is-listening .orb {
            transform: scale(var(--voice-scale));
            filter: saturate(var(--orb-saturation)) brightness(var(--orb-brightness));
            transition: transform .08s ease-out, filter .08s ease-out;
        }
        .orb-wrap.is-processing .processing-ring { opacity: 1; animation: process 1.05s linear infinite; }
        @keyframes process { to { transform: rotate(360deg); } }

        .transcript {
            min-height: 25px;
            margin: 0 auto;
            color: #7f7382;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.45;
        }

        .processing {
            min-height: 22px;
            margin: 8px 0 0;
            color: #b06d9d;
            font-size: 13px;
            opacity: 0;
            transition: opacity .18s;
        }
        .processing.visible { opacity: 1; }

        .sentence-card {
            min-height: 137px;
            margin-top: 19px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 16px 30px rgba(137, 73, 120, .09);
        }

        .eyebrow { margin: 0 0 9px; color: #9a7d91; font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        .sentence { margin: 0; color: var(--ink); font-size: clamp(23px, 6vw, 28px); font-weight: 750; letter-spacing: -1px; line-height: 1.23; }
        .sentence.waiting { color: #8e8491; font-size: 19px; font-weight: 500; letter-spacing: -.45px; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: 84px;
            gap: 12px;
            margin-top: 20px;
            padding-top: 0;
        }
        .action-button {
            width: 100%;
            height: 84px;
            min-height: 0;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 23px;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }
        .action-button strong { display: block; font-size: 13px; line-height: 1.2; }
        .action-button span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

        .connect { width: 100%; margin-top: 20px; padding: 14px 18px; border: 0; border-radius: 18px; background: #32283a; color: white; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
        .connect.connected { background: #5e4177; }
        .connect:hover { filter: brightness(1.08); }

        @media (min-width: 700px) {
            body { padding: 24px; }
            .app { min-height: 820px; border: 1px solid rgba(255,255,255,.75); border-radius: 38px; box-shadow: 0 22px 70px rgba(112, 61, 100, .16); }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="topbar" aria-label="Application controls">
            <button class="icon-button" type="button" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Speech Bridge</div>
            <button class="icon-button" type="button" aria-label="More options">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
            </button>
        </nav>

        <section class="hero" aria-live="polite">
            <h1>AI Voice Recognition</h1>
            <p class="status" id="status">Connect your device to begin</p>
            <div class="orb-wrap" id="orbWrap" aria-hidden="true">
                <span class="wave wave-one"></span>
                <span class="wave wave-two"></span>
                <span class="wave wave-three"></span>
                <span class="processing-ring"></span>
                <div class="orb"><img src="assets/voice-orb.png" alt="Glossy pink and cyan glass orb"></div>
            </div>
            <p class="transcript" id="heardText">Your recognized words will appear here</p>
            <p class="processing" id="processingText">Understanding your intention…</p>
            <section class="sentence-card" aria-label="Interpreted sentence">
                <p class="eyebrow">I think you mean</p>
                <p class="sentence waiting" id="correctSentence">Waiting for your voice…</p>
            </section>
        </section>

        <div class="quick-actions">
            <button class="action-button" type="button" aria-label="View phrase history">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 19.5V5.7A2.7 2.7 0 0 1 6.7 3h10.6A2.7 2.7 0 0 1 20 5.7v7.6a2.7 2.7 0 0 1-2.7 2.7H10l-4.5 3.5v-3.7A2.7 2.7 0 0 1 4 13.3"/><path d="M9 9h6M9 12h4"/></svg>
                <span><strong>Phrase history</strong><span>Recent messages</span></span>
            </button>
            <button class="action-button" type="button" id="demoButton" aria-label="Play a demonstration">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 3v12"/><path d="M8.5 6.5a5 5 0 1 0 7 0M5 21h14"/></svg>
                <span><strong>Try a demo</strong><span>Preview the flow</span></span>
            </button>
        </div>
        <button class="connect" id="connectButton" type="button">Connect Arduino</button>
    </main>

    <script>
        let port;
        let reader;
        let resultTimer;
        let volumeTimer;

        // How long the "Understanding your intention…" stage stays on screen
        // before the corrected sentence appears.
        const PROCESSING_MS = 2600;
        // The Arduino often repeats the same word on consecutive lines. Ignore
        // repeats inside this window so the result is not restarted mid-display.
        const REPEAT_IGNORE_MS = 4000;
        let lastRaw = "";
        let lastRawAt = 0;

        const sentences = {
            apple: { incorrect: "Apple want eat I", correct: "I want to eat an apple." },
            sleep: { incorrect: "Sleep bed go.", correct: "I am tired and want to go to sleep." },
            water: { incorrect: "Water thirsty give.", correct: "I am thirsty, could I get some water?" },
            cold: { incorrect: "Cold air turn.", correct: "I am feeling cold, please turn off the AC." },
            bathroom: { incorrect: "Bathroom go now.", correct: "I need to use the bathroom right now." }
        };

        const elements = {
            button: document.getElementById("connectButton"),
            status: document.getElementById("status"),
            heard: document.getElementById("heardText"),
            processing: document.getElementById("processingText"),
            sentence: document.getElementById("correctSentence"),
            orb: document.getElementById("orbWrap")
        };

        function setListening(isListening) {
            elements.orb.classList.toggle("is-listening", isListening);
            elements.orb.classList.remove("is-processing");
        }

        // Arduino can send a separate line such as "volume:0.72" (or "volume:72").
        // This changes only the visual listening feedback; it never replaces the recognized phrase.
        function setVoiceLevel(value) {
            const level = Math.max(0.04, Math.min(1, Number(value) || 0));
            elements.orb.style.setProperty("--voice-level", level.toFixed(2));
            elements.orb.style.setProperty("--voice-scale", (1 + level * 0.085).toFixed(3));
            elements.orb.style.setProperty("--wave-scale", (1 + level * 0.12).toFixed(3));
            elements.orb.style.setProperty("--wave-opacity", (.1 + level * .54).toFixed(2));
            elements.orb.style.setProperty("--orb-saturation", (1 + level * .35).toFixed(2));
            elements.orb.style.setProperty("--orb-brightness", (1 + level * .12).toFixed(2));
            clearTimeout(volumeTimer);
            volumeTimer = setTimeout(() => setVoiceLevel(0.07), 180);
        }

        function showPrediction(raw) {
            const normalized = raw.trim().toLowerCase();
            const now = Date.now();
            if (normalized === lastRaw && now - lastRawAt < REPEAT_IGNORE_MS) return;
            lastRaw = normalized;
            lastRawAt = now;

            const data = sentences[normalized];
            const heardText = data ? data.incorrect : raw.trim();
            const sentence = data ? data.correct : raw.trim();

            clearTimeout(resultTimer);
            elements.heard.textContent = heardText;
            elements.sentence.textContent = "Listening to your words…";
            elements.sentence.classList.add("waiting");
            elements.processing.classList.add("visible");
            elements.orb.classList.remove("is-listening");
            elements.orb.classList.add("is-processing");

            resultTimer = setTimeout(() => {
                elements.sentence.textContent = sentence;
                elements.sentence.classList.remove("waiting");
                elements.processing.classList.remove("visible");
                setListening(true);
            }, PROCESSING_MS);
        }

        async function connectArduino() {
            if (!("serial" in navigator)) {
                elements.status.textContent = "Use Chrome or Microsoft Edge to connect your device";
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                elements.status.textContent = "Arduino connected · Listening for your voice";
                elements.button.textContent = "Arduino Connected";
                elements.button.classList.add("connected");
                setListening(true);
                await readSerial();
            } catch (error) {
                console.error(error);
                elements.status.textContent = "Connection failed. Please try again.";
                setListening(false);
            }
        }

        async function readSerial() {
            const decoder = new TextDecoderStream();
            const pipeClosed = port.readable.pipeTo(decoder.writable);
            reader = decoder.readable.getReader();
            let buffer = "";

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    lines.forEach((line) => {
                        const raw = line.trim();
                        const volumeMatch = raw.match(/^volume\s*:\s*([\d.]+)$/i);
                        if (volumeMatch) {
                            const received = Number(volumeMatch[1]);
                            setVoiceLevel(received > 1 ? received / 100 : received);
                        } else if (raw) {
                            showPrediction(raw);
                        }
                    });
                }
            } catch (error) {
                console.error(error);
                elements.status.textContent = "Device connection ended";
                setListening(false);
            } finally {
                reader.releaseLock();
                await pipeClosed.catch(() => {});
            }
        }

        elements.button.addEventListener("click", connectArduino);
        document.getElementById("demoButton").addEventListener("click", () => {
            setListening(true);
            lastRaw = "";
            const demoLevels = [.12, .42, .76, .3, .61, .16];
            demoLevels.forEach((level, index) => {
                setTimeout(() => setVoiceLevel(level), index * 130);
            });
            setTimeout(() => showPrediction("apple"), demoLevels.length * 130 + 120);
        });
    </script>
</body>
</html>
